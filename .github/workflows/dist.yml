name: Distributions

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish built distributions to PyPI (skip files already uploaded)
        type: boolean
        default: false

concurrency:
  # Cancel previous runs of this workflow for the same branch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_metadata:
    name: Validate package metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7.4.0
      - name: Validate pyproject.toml and PyPI classifiers
        run: uvx --from 'validate-pyproject[all]==0.26' validate-pyproject pyproject.toml

  make_sdist:
    name: Build sdist
    needs: validate_metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7.4.0
      - name: Build sdist
        run: uv build --sdist
      - uses: actions/upload-artifact@v4
        with:
          path: "dist/*.tar.*"
          name: release-sdist

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: validate_metadata
    runs-on: ${{ matrix.runs_on || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - windows-11-arm
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-latest
          - darwin-27
        include:
          - os: darwin-27
            runs_on:
              group: sage-darwin27
              labels: darwin-27
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7.4.0
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.0
      - uses: actions/upload-artifact@v7.0.0
        if: matrix.os != 'darwin-27'
        with:
          name: release-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  pypi-publish:
    # This needs to be a separate job because pypa/gh-action-pypi-publish cannot run on macOS
    # https://github.com/pypa/gh-action-pypi-publish
    name: Upload wheels to PyPI
    needs: [build_wheels, make_sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      
      - name: List files
        run: ls -l -R dist

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v4.1.0
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
        with:
          subject-path: "dist/*"

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          skip-existing: ${{ github.event_name == 'workflow_dispatch' }}
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
